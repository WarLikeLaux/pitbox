name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: shellcheck
        run: shellcheck bin/pitbox
      - name: CLI and MCP smoke
        run: bash scripts/smoke.sh
